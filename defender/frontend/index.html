<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Defender Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Game scripts -->
  <script src="game/renderer.js"></script>
  <script src="game/hud.js"></script>
  <script src="game/main.js"></script>
  <script>
    // Start the game once everything is loaded
    window.addEventListener('load', () => {
      if (window.GameMain && typeof window.GameMain.start === 'function') {
        window.GameMain.start();
      } else {
        console.warn('GameMain.start not available');
      }
    });
  </script>
</body>
</html>
