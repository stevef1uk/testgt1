<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Defender</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 1px solid #333; }
        #hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #0f0; font: 16px monospace; }
    </style>
</head>
<body>
    <div id="hud">SCORE: 0 | HIGH: 0 | LIVES: 3</div>
    <canvas id="game"></canvas>
    <script src="/static/game/main.js" type="module"></script>
</body>
</html>
